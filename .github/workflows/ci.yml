name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel-analysis-agent-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (core files)
        # Not yet every file in the project - widen this list as more files
        # get checked (see docs/improvement-plan.md). These five are clean
        # as of 2026-09-02, so this blocks on new type errors instead of
        # just reporting them.
        run: uv run mypy tools.py agent_tools.py agent.py store.py long_term_memory.py

      - name: Pytest
        run: uv run pytest -q
